<style>
  :root{--bg:#0d0f14;--fg:#e8eaf0;--mute:#8a90a0;--chip:#1b1f29;--chip-on:#2d3446;--line:#2a3040}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}

  button[aria-pressed="true"]{background:var(--chip-on);border-color:#4a5675}
  .hint{position:fixed;top:14px;left:0;right:0;text-align:center;color:var(--mute);font-size:12px;pointer-events:none}
</style>

const W=0.63, H=0.88, T=0.006, R=0.032;
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30,1,0.01,20);
let camDist = 2.1; camera.position.set(0,0,camDist);

// rounded-rect slab; UVs are derived from position in the shader
const s = new THREE.Shape();
s.moveTo(-W/2+R,-H/2); s.lineTo(W/2-R,-H/2); s.quadraticCurveTo(W/2,-H/2,W/2,-H/2+R);
s.lineTo(W/2,H/2-R); s.quadraticCurveTo(W/2,H/2,W/2-R,H/2);
s.lineTo(-W/2+R,H/2); s.quadraticCurveTo(-W/2,H/2,-W/2,H/2-R);
s.lineTo(-W/2,-H/2+R); s.quadraticCurveTo(-W/2,-H/2,-W/2+R,-H/2);
const geo = new THREE.ExtrudeGeometry(s,{depth:T,bevelEnabled:false,curveSegments:10});
geo.translate(0,0,-T/2);

const loader = new THREE.TextureLoader();
const tex = (src,srgb=true)=>{const t=loader.load(src); if(srgb)t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;};

const vert = `
varying vec3 vPos; varying vec3 vN; varying vec3 vW; varying vec3 vObjN;
void main(){
  vPos=position; vObjN=normal;
  vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz;
  vN=normalize(mat3(modelMatrix)*normal);
  gl_Position=projectionMatrix*viewMatrix*w;
}`;
const frag = `
uniform sampler2D uFront,uBack,uBackMask; uniform vec2 uSize; uniform float uHolo,uFoilOn,uTime;
varying vec3 vPos; varying vec3 vN; varying vec3 vW; varying vec3 vObjN;

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
vec3 hue(float h){return clamp(abs(mod(h*6.0+vec3(0,4,2),6.0)-3.0)-1.0,0.0,1.0);}
vec3 toLin(vec3 c){return pow(c,vec3(2.2));}

// studio environment: soft boxes + floor/ceiling gradient
vec3 env(vec3 r){
  vec3 c = mix(vec3(0.03,0.035,0.05), vec3(0.16,0.17,0.2), smoothstep(-0.6,0.8,r.y));
  c += vec3(1.0,0.97,0.92)*3.2*pow(max(dot(r,normalize(vec3(-0.45,0.55,0.7))),0.0),90.0);   // key softbox
  c += vec3(0.75,0.85,1.0)*1.6*pow(max(dot(r,normalize(vec3(0.7,0.15,0.7))),0.0),55.0);     // rim panel
  c += vec3(1.0)*0.9*smoothstep(0.985,0.995,dot(r,normalize(vec3(0.1,0.95,0.3))));          // ceiling strip
  return c;
}

void main(){
  vec2 uv = vPos.xy/uSize + 0.5;
  vec3 N = normalize(vN);
  vec3 V = normalize(cameraPosition - vW);
  if(!gl_FrontFacing) N=-N;
  vec3 Rf = reflect(-V,N);
  float NdV = clamp(dot(N,V),0.0,1.0);
  float fres = 0.04 + 0.96*pow(1.0-NdV,5.0);
  vec3 L = normalize(vec3(-0.45,0.55,0.7));
  float diff = 0.95 + 0.35*max(dot(N,L),0.0);

  vec3 col;
  if(vObjN.z > 0.5){                      // FRONT
    vec3 base = toLin(texture2D(uFront,uv).rgb);
    float lum = dot(base,vec3(0.3,0.59,0.11));
    // foil sits under the art: strongest in mid/bright areas, weak on black text panels
    float foil = uHolo*uFoilOn*smoothstep(0.015,0.25,lum);
    // rainbow shifts with viewing angle + position (diffraction-like)
    float h = dot(Rf.xy,vec2(1.6,1.1)) + uv.x*0.9 + uv.y*1.4;
    vec3 rb = hue(fract(h));
    // fine linear foil grain (horizontal micro-lines seen in the video)
    float lines = 0.5+0.5*sin(uv.y*900.0 + Rf.x*30.0);
    float angleGlow = pow(1.0 - abs(dot(normalize(Rf.xy+1e-4), normalize(vec2(0.6,0.8)))) ,2.0)*0.4 + 0.6;
    // sparkle: per-cell tilted micro-facets
    vec2 cell = floor(uv*vec2(220.0,300.0));
    vec3 fn = normalize(N + 0.35*(vec3(hash(cell),hash(cell+7.3),0.0)-0.5));
    float sp = pow(max(dot(reflect(-V,fn),L),0.0),400.0)*step(0.55,hash(cell+3.1));
    col = base*diff;
    col += foil * rb * (0.22 + 0.25*lines) * angleGlow * (0.4+lum);
    col += foil * sp * hue(hash(cell+1.7)) * 2.5;
    // broad sweeping sheen band that slides across as the card tilts
    float bx = dot(Rf.xy, vec2(0.75,0.65))*2.2 + (uv.x*0.8+uv.y*0.6-0.7);
    float band = exp(-bx*bx*6.0);
    col += band * mix(vec3(0.5), rb*1.2, foil) * (0.25 + 0.35*foil);
    col += env(Rf) * fres * 0.9 + env(Rf) * 0.06;   // glossy coat
  } else if(vObjN.z < -0.5){              // BACK (mirror u so text reads correctly)
    vec2 buv = vec2(1.0-uv.x, uv.y);
    vec3 base = toLin(texture2D(uBack,buv).rgb);
    float m = texture2D(uBackMask,buv).r;  // raised spot-gloss swirl
    vec2 e = vec2(1.0/900.0,1.0/1257.0)*2.0;
    float dx = texture2D(uBackMask,buv+vec2(e.x,0)).r - texture2D(uBackMask,buv-vec2(e.x,0)).r;
    float dy = texture2D(uBackMask,buv+vec2(0,e.y)).r - texture2D(uBackMask,buv-vec2(0,e.y)).r;
    vec3 Nb = normalize(N + 0.3*(vec3(-dx,-dy,0.0)));  // bump from the varnish pattern
    vec3 Rb = reflect(-V,Nb);
    col = base*diff;
    float gm = smoothstep(0.42,0.62,m);
    col += env(Rb) * (fres*0.9 + 0.08 + 0.6*gm);
    float bb = dot(Rb.xy, vec2(0.75,0.65))*2.2 + (buv.x*0.8+buv.y*0.6-0.7);
    col += exp(-bb*bb*6.0) * (0.06 + 0.35*gm);
  } else {                                // EDGE: card stock
    col = vec3(0.6,0.61,0.6)*diff + env(Rf)*0.05;
  }
  col = col/(1.0+col*0.15);               // gentle tonemap
  gl_FragColor = vec4(pow(col,vec3(1.0/2.2)),1.0);
}`;

const mat = new THREE.ShaderMaterial({
  vertexShader:vert, fragmentShader:frag, side:THREE.DoubleSide,
  uniforms:{uFront:{value:null},uBack:{value:null},uBackMask:{value:null},
    uSize:{value:new THREE.Vector2(W,H)},uHolo:{value:1},uFoilOn:{value:1},uTime:{value:0}}
});
const card = new THREE.Mesh(geo,mat);
scene.add(card);

function show(i){
  const c=CARDS[i];
  mat.uniforms.uFront.value=tex(c.front);
  mat.uniforms.uBack.value=tex(c.back);
  mat.uniforms.uBackMask.value=tex(c.backMask,false);
  mat.uniforms.uHolo.value=c.holo;
  tFlip=Math.round(tFlip/(2*Math.PI))*2*Math.PI;   // show the front when switching cards
  document.querySelectorAll('#cards button').forEach((b,j)=>b.setAttribute('aria-pressed',i===j));
}
const cardsEl=document.getElementById('cards');
if(CARDS.length>1) CARDS.forEach((c,i)=>{const b=document.createElement('button');b.textContent=c.name;b.onclick=()=>show(i);cardsEl.appendChild(b);cardsEl.append(' ');});

// ---- interaction: drag tilts the card, lights stay fixed so reflections slide ----
let rotX=0, rotY=0, tX=0, tY=0, flip=0, tFlip=0, sway=true, drag=null, lastTap=0;
show(0);
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,rx:tX,ry:tY};cv.setPointerCapture(e.pointerId);
  const now=performance.now(); if(now-lastTap<300) doFlip(); lastTap=now;});
cv.addEventListener('pointermove',e=>{if(!drag)return;
  tY=drag.ry+(e.clientX-drag.x)*0.008; tX=drag.rx+(e.clientY-drag.y)*0.008;});
cv.addEventListener('pointerup',()=>drag=null);
cv.addEventListener('wheel',e=>{camDist=THREE.MathUtils.clamp(camDist+e.deltaY*0.0015,1.1,4);e.preventDefault();},{passive:false});
const doFlip=()=>{tFlip+=Math.PI;};
const toggle=(id,fn)=>{const b=document.getElementById(id);b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);fn(on);};};
document.getElementById('flip').onclick=doFlip;
toggle('auto',on=>sway=on);
toggle('foil',on=>mat.uniforms.uFoilOn.value=on?1:0);
document.getElementById('reset').onclick=()=>{tX=0;tY=0;tFlip=Math.round(tFlip/(2*Math.PI))*2*Math.PI;camDist=2.1;};

function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;
  camera.fov = camera.aspect<0.8 ? 42 : 30; camera.updateProjectionMatrix();}
addEventListener('resize',resize); resize();

const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const t=clock.getElapsedTime();
  const sx = sway&&!drag ? Math.sin(t*0.9)*0.22 : 0, sy = sway&&!drag ? Math.sin(t*0.6)*0.35 : 0;
  rotX+=(tX+sx-rotX)*0.12; rotY+=(tY+sy-rotY)*0.12; flip+=(tFlip-flip)*0.1;
  card.rotation.set(rotX, rotY+flip, 0);
  camera.position.z+= (camDist-camera.position.z)*0.15;
  mat.uniforms.uTime.value=t;
  renderer.render(scene,camera);
});
</script>
</body>
</html>
