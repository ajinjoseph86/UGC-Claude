<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:720px;height:1560px;background:#0d1016;font-family:"DejaVu Sans",Arial,sans-serif;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#1b2233 0%,#0d1016 70%)}
.dash{position:absolute;left:60px;top:50px;color:#3c4558;font-size:15px}
.row{position:absolute;left:60px;right:60px;height:14px;background:#161b26;border-radius:7px}
.card{position:absolute;left:50%;top:50%;width:640px;margin-left:-320px;margin-top:-260px;height:520px;background:linear-gradient(160deg,#1e2638,#151b28);border:1.5px solid #3a4866;border-radius:26px;box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 60px rgba(255,190,60,.10);text-align:center;transform-origin:50% 50%}
.badge{margin:50px auto 0;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe7a1,#f4b52e 55%,#b9780d);box-shadow:0 0 40px rgba(255,190,60,.45);display:flex;align-items:center;justify-content:center;color:#5a3a00;font-size:64px;font-weight:800}
.t1{margin-top:30px;color:#aeb8cc;font-size:24px;letter-spacing:3px}
.t2{margin-top:10px;color:#fff;font-size:50px;font-weight:700}
.t3{margin-top:10px;color:#ffcf5a;font-size:34px}
.timer{margin:30px auto 0;display:inline-block;padding:12px 24px;border-radius:14px;background:#2a1418;border:1px solid #6b2a33;color:#ff6b7a;font-size:28px;font-family:"DejaVu Sans Mono",monospace}
.conf{position:absolute;width:10px;height:16px;border-radius:2px}
</style></head><body><div class="bg"></div>
<div class="dash">Dashboard</div>
<div class="row" style="top:110px;width:420px"></div><div class="row" style="top:130px;width:300px"></div>
<div class="row" style="top:1380px"></div><div class="row" style="top:1410px;width:400px"></div>
<div id="conf"></div>
<div class="card" id="c"><div class="badge">★</div>
<div class="t1">CONGRATULATIONS</div><div class="t2">Participation reward</div>
<div class="t3">+20 credits</div><div class="timer" id="tm">Expires in 00:59:59</div></div>
</body></html>
